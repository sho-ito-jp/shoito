<main class="page stage-page">
  <section class="section">
    <div class="meta">台 / STAGE</div>

    <div class="stage-list" id="stage-list">
      <!-- CMSから自動生成 -->
    </div>

    <script>
    async function loadStage() {
      const container = document.getElementById("stage-list");

      try {
        const response = await fetch(
          "https://api.github.com/repos/sho-ito-jp/shoito/contents/content/stage"
        );

        if (!response.ok) {
          throw new Error("GitHub API error: " + response.status);
        }

        const files = await response.json();

        for (const file of files) {
          if (!file.name.endsWith(".md")) continue;

          const response = await fetch(file.download_url);
          const text = await response.text();

          const match = text.match(/^---\s*([\s\S]*?)\s*---/);

          if (!match) continue;

          const frontMatter = match[1];

          const getValue = (name) => {
            const match = frontMatter.match(
              new RegExp("^" + name + ":\\s*(.+)$", "m")
            );
            return match ? match[1].trim() : "";
          };

          const date = getValue("date");
          const title = getValue("title");
          const description = getValue("description");

          if (!title) continue;

          const item = document.createElement("article");
          item.className = "stage-item";

          item.innerHTML = `
            <div class="stage-date">${date}</div>
            <div class="stage-info">
              <h2>${title}</h2>
              <p>${description}</p>
            </div>
          `;

          container.appendChild(item);
        }

      } catch (error) {
        console.error("Stageの読み込みに失敗しました:", error);
      }
    }

    loadStage();
    </script>

  </section>
</main>
