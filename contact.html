<main class="page contact-page">

<div id="contact-questions"></div>

  <section class="contact-card panel">    <div class="meta">問 / CONTACT</div>
    
    <p>お問い合わせ・ご連絡はこちらから。</p>
<form action="https://api.lazyforms.com/f/4270da2c-4a7d-42c2-b792-b78dbdeb811d" method="POST">

  <label for="name">
    名前 - Name :
    <input
      id="name"
      type="text"
      name="name"
      placeholder="お名前を入力してください"
      required
    >
  </label>

  <label for="email">
    メールアドレス - Email :
    <input
      id="email"
      type="email"
      name="email"
      placeholder="info@shoito.jp"
      required
    >
  </label>

  <label for="company">
    会社名 - Company :
    <input
      id="company"
      type="text"
      name="company"
      placeholder="会社名、団体名を入力してください"
    >
  </label>

  <label for="contact-type">
    内容 - Contact Type:
    <select id="contact-type" name="contact_type" required>
      <option value="" selected disabled>内容を選択してください</option>
      <option value="制作依頼">製作依頼</option>
      <option value="メディア掲載">メディア等の掲載</option>
      <option value="その他">その他</option>
    </select>
  </label>

  <label for="message">
    Message :
    <textarea
      id="message"
      name="message"
      placeholder="メッセージを入力してください"
      required
    ></textarea>
  </label>

  <button class="submit" type="submit">
    送る - Send →
  </button>

</form>
  </section>


<script>
async function loadQuestions() {
  const container = document.getElementById("contact-questions");

  try {
    const response = await fetch(
      "https://api.github.com/repos/sho-ito-jp/shoito/contents/content/questions"
    );

    if (!response.ok) {
      throw new Error("GitHub API error: " + response.status);
    }

    const files = await response.json();

    const questions = [];

    for (const file of files) {
      if (!file.name.endsWith(".md")) continue;

      const mdResponse = await fetch(file.download_url);
      const text = await mdResponse.text();

      const match = text.match(/^---\s*([\s\S]*?)\s*---/);

      if (!match) continue;

      const frontMatter = match[1];

      const questionMatch =
        frontMatter.match(/^question:\s*(.+)$/m);

      if (!questionMatch) continue;

      questions.push(questionMatch[1].trim());
    }

    let index = 0;

    function showNextQuestion() {
      if (index >= questions.length) return;

      const question = document.createElement("div");
      question.className = "contact-question";

      container.appendChild(question);

      const text = questions[index];
      let charIndex = 0;

      // タイプ開始
      const typing = setInterval(() => {
        question.textContent = text.slice(0, charIndex) + "｜";
        charIndex++;

        if (charIndex > text.length) {
          clearInterval(typing);

          // カーソルを消す
          question.textContent = text;

          index++;

          // 次の問い
          setTimeout(showNextQuestion, 700);
        }
      }, 70);
    }

    showNextQuestion();

  } catch (error) {
    console.error("問いの読み込みに失敗しました:", error);
  }
}

loadQuestions();
</script>
</main>
