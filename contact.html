<button class="sound-toggle" data-sound-toggle type="button">音 ON</button>


<main class="page contact-page">
  <div class="questions"><div class="question" style="top:0%;animation-delay:-0.0s">何を作る？</div><div class="question" style="top:12%;animation-delay:-1.4s">どこから始める？</div><div class="question" style="top:24%;animation-delay:-2.8s">これは誰のもの？</div><div class="question" style="top:36%;animation-delay:-4.199999999999999s">音は場所を変える？</div><div class="question" style="top:48%;animation-delay:-5.6s">作品はいつ完成する？</div><div class="question" style="top:60%;animation-delay:-7.0s">地元とは何？</div><div class="question" style="top:72%;animation-delay:-8.399999999999999s">表現する必要はある？</div><div class="question" style="top:84%;animation-delay:-9.799999999999999s">あなたは何者？</div><div class="question" style="top:96%;animation-delay:-11.2s">何を残す？</div></div>
  <section class="contact-card panel">
    <div class="meta">問 / CONTACT</div>
    <h1 class="page-title">コンタクト</h1>
    <p>お問い合わせ・ご連絡はこちらから。</p>
<form action="https://api.lazyforms.com/f/4270da2c-4a7d-42c2-b792-b78dbdeb811d" method="POST">

  <label for="name">
    名前 - Name :
    <input
      id="name"
      type="text"
      name="name"
      placeholder="お名前を入力してください"
      required
    >
  </label>

  <label for="email">
    メールアドレス - Email :
    <input
      id="email"
      type="email"
      name="email"
      placeholder="info@shoito.jp"
      required
    >
  </label>

  <label for="company">
    会社名 - Company :
    <input
      id="company"
      type="text"
      name="company"
      placeholder="会社名、団体名を入力してください"
    >
  </label>

  <label for="contact-type">
    内容 - Contact Type:
    <select id="contact-type" name="contact_type" required>
      <option value="" selected disabled>内容を選択してください</option>
      <option value="制作依頼">伊藤翔への製作依頼</option>
      <option value="メディア掲載">伊藤翔に関するメディア等の掲載</option>
      <option value="その他">その他、伊藤翔に関するお問い合わせ</option>
    </select>
  </label>

  <label for="message">
    Message :
    <textarea
      id="message"
      name="message"
      placeholder="メッセージを入力してください"
      required
    ></textarea>
  </label>

  <button class="submit" type="submit">
    送る - Send →
  </button>

</form>
  </section>
</main>
