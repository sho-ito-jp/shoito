<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>伊藤翔</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <main id="home">

    <!-- 左上 -->
    <nav class="nav-top-left">
      <button data-modal="works">WORKS</button>
      <button data-modal="stage">STAGE</button>
      <button data-modal="links">LINKS</button>
    </nav>

    <!-- 中央：ホーム動画 -->
    <div class="home-video">
      <video autoplay muted loop playsinline>
        <source src="home.mp4" type="video/mp4">
      </video>
    </div>

    <!-- 左下 -->
    <nav class="nav-bottom-left">
      <button data-modal="contact">CONTACT</button>
        <button onclick="window.open('https://label.shoito.jp/', '_blank')">　LABEL</button>
    </nav>

  </main>



<!-- WORKS -->
<section class="modal" id="works">
  <button class="modal-close">CLOSE</button>

  <div class="modal-content works-content">

    <div class="works-column">
      <h2>DISCOGRAPHY</h2>

      <div class="disco-cloud" id="discography-list">
        <!-- 旧DISCOGRAPHYと同じCMSデータをここへ -->
      </div>
    </div>

    <div class="works-column">
      <h2>WORKS</h2>

      <div class="works-list" id="works-list">
        <!-- 旧WORKSと同じCMSデータをここへ -->
      </div>
    </div>

  </div>
</section>


  <!-- STAGE -->
  <section class="modal" id="stage">
    <button class="modal-close">CLOSE</button>

    <div class="modal-content">
      <h2>STAGE</h2>

      <div class="stage-list">
        <!-- 後で出演情報などを追加 -->
      </div>
    </div>
  </section>

<!-- LINKS -->
<section class="modal" id="links">
  <button class="modal-close">CLOSE</button>

  <div class="modal-content">
    <h2>LINKS</h2>

    <div class="links-list" id="links-list">
      <!-- CMSからリンクを読み込む -->
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="modal" id="contact">
  <button class="modal-close">CLOSE</button>

  <div class="modal-content contact-content">
    <h2>CONTACT</h2>

<form action="https://submit-form.com/WbYSYHV5u" method="POST">

    <input type="hidden" name="_redirect" value="https://shoito.jp/thanks">

      <label>
        名前
        <input type="text" name="name">
      </label>

      <label>
        メールアドレス
        <input type="email" name="email">
      </label>

      <label>
        種類
        <select name="type">
          <option value="">選択してください</option>
          <option value="楽曲・作品について">楽曲・作品について(現在受け付けておりません。)</option>
          <option value="出演・依頼について">出演・依頼について(現在受け付けておりません。)</option>
          <option value="その他">その他</option>
        </select>
      </label>

      <label>
        本文
        <textarea name="message"></textarea>
      </label>

      <button type="submit">送信</button>

    </form>
  </div>
</section>


  <script src="script.js"></script>
</body>
</html>
