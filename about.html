<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>about test</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
            padding: 40px;
            font-size: 1.8rem;
            line-height: 1.8;
        }

        /* 変換中（未確定）の文字のスタイル */
        .converting {
            color: #ffaa00; /* 変換中の色 */
            text-decoration: underline dashed #ffaa00; /* 破線の下線 */
            font-weight: bold;
            background-color: #2a2a2a;
            padding: 0 4px;
            border-radius: 4px;
        }

        /* カーソル */
        .cursor {
            font-weight: bold;
            color: #00adb5;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="log-area"></div>
        <span id="current-line"></span><span class="cursor">|</span>
    </div>

<script>
// ✨【ここを書き換えるだけ！】普通の日本語をそのまま入れてください
const words = [
"※身バレ防止のため、一時的に一部隠しております。",
"2011年生まれ。",
"埼玉県〇〇〇出身。",
"地元・〇〇を拠点に、",
"音楽を中心としたさまざまな表現・制作を行うクリエイター。 ",
"幼少期からダンスやピアノなどの活動を経験し、その後、吹奏楽や合唱などにも活動の幅を広げてきた。",
"作品そのものだけでなく、その見せ方や発表する場所まで含めて、自らつくることを目標としている。 ",
"これまで、ダンスイベントやピアノ発表会、吹奏楽部での演奏会・コンクール、",
"アンサンブルコンテスト、合唱活動など、さまざまな舞台・音楽活動に参加してきた。 ",
"中学生時代には〇〇〇立〇〇〇中学校吹奏楽部に所属し、埼玉県吹奏楽コンクールや定期演奏会、",
"地域イベントなどに出演。2025年にはアンサンブルコンテストやソロコンテストにも参加した。 ",
"高校進学後も音楽活動を継続し、",
"2026年には〇〇高校・〇〇女子高校合同定期演奏会に出演。",
"〇〇〇〇《〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇》の初演にも参加した。",
"また、埼玉県合唱コンクールにも出場するなど、合唱を中心とした活動にも取り組んでいる。",
"こうした経験を経て、これまでに、A veritable pandemoniumやEterd.を始めとした、",
"複数のユニットやプロジェクト、レーベルなどを立ち上げ、さまざまな形態で作品を制作・発表してきた。",
"現在はそれらの活動を整理しながら、自身の作品を軸とした活動へと比重を移し、",
"「伊藤翔」名義にて楽曲をリリースする他、〇〇を起点とする新たなクリエイティブの場を構築している。",
"なお、伊藤翔名義のリリースは「A veritable pandemonium」より行っている。 ",
"その時々に必要な方法を選びながら作品をつくる。",
"さらに、方言を始めとした、地元・〇〇ならではの表現を模索し、地元の文化や芸術に、貢献しようともしている。",
];

let wordIndex = 0;
const logArea = document.getElementById("log-area");
const currentLine = document.getElementById("current-line");

function startTyping() {
    if (wordIndex >= words.length) {
        document.querySelector(".cursor").style.display = "none";
        return;
    }

    const originalText = words[wordIndex];
    let charIndex = 0;

    // 1行の中での処理
    function typeNextChar() {
        if (charIndex < originalText.length) {
            // 現在の文字を取得
            const char = originalText[charIndex];
            
            // 💡【自動判定の仕組み】
            // 漢字やカタカナ、記号なら「一瞬アルファベット(ローマ字風)」を画面に出してから、
            // 150ミリ秒後にひらがな/漢字に変身させる（これによってリアルな変換に見せかけます）
            const isKanjiOrKana = !char.match(/^[ぁ-ん]\$/); // ひらがな以外（漢字・カタカナ・記号）か判定

            if (isKanjiOrKana) {
                // ローマ字っぽく見せるダミーの英数字をランダムに一瞬出す
                const dummyRoma = "bcdfghjklmnpqrstvwxyz".charAt(Math.floor(Math.random() * 21)) + "aiueo".charAt(Math.floor(Math.random() * 5));
                currentLine.innerHTML = `<span class="converting">${originalText.substring(0, charIndex) + dummyRoma}</span>`;
                
                // ほんの少し遅らせて、本物の文字（漢字など）に「変換」させる
                setTimeout(() => {
                    currentLine.innerHTML = `<span class="converting">${originalText.substring(0, charIndex + 1)}</span>`;
                    charIndex++;
                    setTimeout(typeNextChar, 100);
                }, 150); // ローマ字から変換されるまでの隙間時間
            } else {
                // ひらがななら、そのままタイピング（変換中スタイルは維持）
                currentLine.innerHTML = `<span class="converting">${originalText.substring(0, charIndex + 1)}</span>`;
                charIndex++;
                setTimeout(typeNextChar, 120); // 打つスピード
            }
        } else {
            // 1行が完成したらEnterキーで「確定」したようにスタイルを戻して下に追加
            setTimeout(() => {
                logArea.innerHTML += `<div>${originalText}</div>`; // 縦に並べたいのでdivにしました
                currentLine.innerHTML = "";
                wordIndex++;
                setTimeout(startTyping, 600); // 次の行にいくまでの待ち時間
            }, 400); // 打ち終わってから確定するまでの余韻
        }
    }

    typeNextChar();
}

document.addEventListener("DOMContentLoaded", startTyping);
</script>

</body>
</html>
