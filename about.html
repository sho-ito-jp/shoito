<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>about test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            font-size: 2rem;
            line-height: 1.6; /* 行間を少し広げて見やすく */
        }
        /* タイピングの縦棒カーソル（点滅効果） */
        .cursor {
            font-weight: bold;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div>
        <!-- innerHTMLを使うため、枠となる要素を用意します -->
        <span id="typing-area"></span><span class="cursor">|</span>
    </div>

<script>
// 下に向かって順番に表示させたい文章のリスト
const words = [
"2011年生まれ。",
"埼玉県〇〇〇出身。",
"地元・〇〇を拠点に、",
"音楽を中心としたさまざまな表現・制作を行うクリエイター。 ",
"幼少期からダンスやピアノなどの活動を経験し、その後、吹奏楽や合唱などにも活動の幅を広げてきた。",
"作品そのものだけでなく、その見せ方や発表する場所まで含めて、自らつくることを目標としている。 ",
"これまで、ダンスイベントやピアノ発表会、吹奏楽部での演奏会・コンクール、",
"アンサンブルコンテスト、合唱活動など、さまざまな舞台・音楽活動に参加してきた。 ",
"中学生時代には〇〇〇立〇〇〇中学校吹奏楽部に所属し、埼玉県吹奏楽コンクールや定期演奏会、",
"地域イベントなどに出演。2025年にはアンサンブルコンテストやソロコンテストにも参加した。 ",
"高校進学後も音楽活動を継続し、",
"2026年には〇〇高校・〇〇女子高校合同定期演奏会に出演。",
"〇〇〇〇《〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇》の初演にも参加した。",
"また、埼玉県合唱コンクールにも出場するなど、合唱を中心とした活動にも取り組んでいる。",
"こうした経験を経て、これまでに、A veritable pandemoniumやEterd.を始めとした、",
"複数のユニットやプロジェクト、レーベルなどを立ち上げ、さまざまな形態で作品を制作・発表してきた。",
"現在はそれらの活動を整理しながら、自身の作品を軸とした活動へと比重を移し、",
"「伊藤翔」名義にて楽曲をリリースする他、〇〇を起点とする新たなクリエイティブの場を構築している。",
"なお、伊藤翔名義のリリースは「A veritable pandemonium」より行っている。 ",
"その時々に必要な方法を選びながら作品をつくる。",
"さらに、方言を始めとした、地元・〇〇ならではの表現を模索し、地元の文化や芸術に、貢献しようともしている。",
];

let wordIndex = 0;
let charIndex = 0;
let completedText = ""; // 打ち終わった過去の文章を保存する変数

const areaElement = document.getElementById("typing-area");

function typeEffect() {
    // すべての文章を打ち終えたらカーソルを消して終了
    if (wordIndex >= words.length) {
        document.querySelector(".cursor").style.display = "none";
        return;
    }

    const currentWord = words[wordIndex];
    
    // 現在打っている文字を切り出す
    const currentChar = currentWord.substring(0, charIndex + 1);
    
    // 過去の確定文章 + 今打っている文字 を画面に表示
    areaElement.innerHTML = completedText + currentChar;
    charIndex++;

    let typingSpeed = 100; // 文字を打つスピード（ミリ秒）

    // 1つの文章（行）が打ち終わったとき
    if (charIndex === currentWord.length) {
        // 打ち終わった文章に改行（<br>）を足して保存
        completedText += currentWord + "<br>"; 
        
        wordIndex++;    // 次の文章へ
        charIndex = 0;  // 文字のカウントをリセット
        typingSpeed = 1000; // 次の行にいく前の待ち時間（1秒）
    }

    setTimeout(typeEffect, typingSpeed);
}

// アニメーションの開始
document.addEventListener("DOMContentLoaded", typeEffect);
</script>

</body>
</html>
