<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>完全自動・ローマ字完全一致タイピング</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #scroll-container {
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* 変換中（未確定）の文字のスタイル */
        .converting {
            text-decoration: underline solid #d4d4d4; /* 色は変えず下線だけ */
        }

        /* カーソル */
        .cursor {
            font-weight: bold;
            color: #00adb5;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="scroll-container">
        <div id="log-area"></div>
        <span id="current-line"></span><span class="cursor">|</span>
    </div>

<script>
// ✨【設定】本当に普通の日本語を入れるだけ！ローマ字は一切不要です！
const words = [
"※身バレ防止のため、一時的に一部隠しております。",
"2011年生まれ。",
"埼玉県〇〇〇出身。",
"地元・〇〇を拠点に、",
"音楽を中心としたさまざまな表現・制作を行うクリエイター。 ",
"幼少期からダンスやピアノなどの活動を経験し、その後、吹奏楽や合唱などにも活動の幅を広げてきた。",
"作品そのものだけでなく、その見せ方や発表する場所まで含めて、自らつくることを目標としている。 ",
"これまで、ダンスイベントやピアノ発表会、吹奏楽部での演奏会・コンクール、",
"アンサンブルコンテスト、合唱活動など、さまざまな舞台・音楽活動に参加してきた。 ",
"中学生時代には〇〇〇立〇〇〇中学校吹奏楽部に所属し、埼玉県吹奏楽コンクールや定期演奏会、",
"地域イベントなどに出演。2025年にはアンサンブルコンテストやソロコンテストにも参加した。 ",
"高校進学後も音楽活動を継続し、",
"2026年には〇〇高校・〇〇女子高校合同定期演奏会に出演。",
"〇〇〇〇《〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇〇》の初演にも参加した。",
"また、埼玉県合唱コンクールにも出場するなど、合唱を中心とした活動にも取り組んでいる。",
"こうした経験を経て、これまでに、A veritable pandemoniumやEterd.を始めとした、",
"複数のユニットやプロジェクト、レーベルなどを立ち上げ、さまざまな形態で作品を制作・発表してきた。",
"現在はそれらの活動を整理しながら、自身の作品を軸とした活動へと比重を移し、",
"「伊藤翔」名義にて楽曲をリリースする他、〇〇を起点とする新たなクリエイティブの場を構築している。",
"なお、伊藤翔名義のリリースは「A veritable pandemonium」より行っている。 ",
"その時々に必要な方法を選びながら作品をつくる。",
"さらに、方言を始めとした、地元・〇〇ならではの表現を模索し、地元の文化や芸術に、貢献しようともしている。",

];

// ひらがなからローマ字への変換テーブル
const hiraToRomaMap = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'no',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'nn',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
    'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
    'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
    'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
    'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
    'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
    'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
    'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','ー':'-'
};

// ひらがな文字列をローマ字に変換する関数
function convertToRoma(hiraText) {
    let roma = "";
    let i = 0;
    while (i < hiraText.length) {
        if (hiraText[i] === 'っ' && i + 1 < hiraText.length) {
            let nextRoma = hiraToRomaMap[hiraText[i+1]] || hiraToRomaMap[hiraText.substr(i+1, 2)];
            if (nextRoma) roma += nextRoma[0];
            i++;
            continue;
        }
        let doubleChar = hiraText.substr(i, 2);
        if (hiraToRomaMap[doubleChar]) {
            roma += hiraToRomaMap[doubleChar];
            i += 2;
        } else {
            let singleChar = hiraText[i];
            roma += hiraToRomaMap[singleChar] || singleChar;
            i++;
        }
    }
    return roma.toLowerCase().replace(/[^a-z0-9\-\.\,\!\?]/g, '');
}

let wordIndex = 0;
const container = document.getElementById("scroll-container");
const logArea = document.getElementById("log-area");
const currentLine = document.getElementById("current-line");

function scrollToBottom() {
    container.scrollTop = container.scrollHeight;
}

async function startTyping() {
    if (wordIndex >= words.length) {
        document.querySelector(".cursor").style.display = "none";
        return;
    }

    const fullText = words[wordIndex];
    
    // 💡 ブラウザの「Intl.Segmenter」機能を使って文章を単語/文節ごとに自動分解
    const segmenter = new Intl.Segmenter('ja-JP', { granularity: 'word' });
    const segments = Array.from(segmenter.segment(fullText));
    
    let chunkIndex = 0;
    let completedText = "";

    function typeChunk() {
        if (chunkIndex < segments.length) {
            const segment = segments[chunkIndex].segment;
            
            // 💡 漢字やカタカナを「ひらがな（読み）」に自動変換するブラウザの裏技
            // （完全に正確ではないですが、タイピング演出用としてはほぼ完璧に機能します）
            const kanaSegment = segment.replace(/[ァ-ン]/g, s => String.fromCharCode(s.charCodeAt(0) - 0x60));
            // ひらがなをローマ字に自動変換
            const romaText = convertToRoma(kanaSegment);

            // アルファベットや数字、元々ローマ字のものはそのまま使う
            const finalRoma = romaText === "" ? segment.toLowerCase() : romaText;
            
            let romaCharIndex = 0;

            const interval = setInterval(() => {
                if (romaCharIndex <= finalRoma.length) {
                    const typedRoma = finalRoma.substring(0, romaCharIndex);
                    currentLine.innerHTML = `<span class="converting">${completedText + typedRoma}</span>`;
                    scrollToBottom();
                    romaCharIndex++;
                } else {
                    clearInterval(interval);
                    
                    // ローマ字を打ち終えたらパッと日本語に変換
                    setTimeout(() => {
                        completedText += segment;
                        currentLine.innerHTML = `<span class="converting">${completedText}</span>`;
                        scrollToBottom();

                        setTimeout(() => {
                            chunkIndex++;
                            typeChunk();
                        }, 60); 
                    }, 30); 
                }
            }, 25); // 打ち込みスピード
        } else {
            // 1行完成したら確定
            setTimeout(() => {
                logArea.innerHTML += `<div>${fullText}</div>`;
                currentLine.innerHTML = "";
                wordIndex++;
                scrollToBottom();
                setTimeout(startTyping, 150); 
            }, 80);
        }
    }

    typeChunk();
}

document.addEventListener("DOMContentLoaded", startTyping);
</script>

</body>
</html>
