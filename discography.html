<div class="disco-cloud" id="discography-list">
  <!-- CMSから自動生成 -->
</div>
<script>
async function loadDiscography() {
  const container = document.getElementById("discography-list");

  try {
    const response = await fetch(
      "https://api.github.com/repos/sho-ito-jp/shoito/contents/content/discography"
    );

    if (!response.ok) {
      throw new Error("GitHub API error: " + response.status);
    }

    const files = await response.json();

    for (const file of files) {
      if (!file.name.endsWith(".md")) continue;

      const response = await fetch(file.download_url);
      const text = await response.text();

      const match = text.match(/^---\s*([\s\S]*?)\s*---/);

      if (!match) continue;

      const frontMatter = match[1];

      const titleMatch = frontMatter.match(/^title:\s*(.+)$/m);
      const urlMatch = frontMatter.match(/^url:\s*(.+)$/m);

      if (!titleMatch) continue;

      const title = titleMatch[1].trim();
      const url = urlMatch ? urlMatch[1].trim() : "#";

      const button = document.createElement("button");

      button.className = "track";
      button.textContent = title;

      /* ランダム配置 */
      const left = 5 + Math.random() * 85;
      const top = 5 + Math.random() * 80;
      const rotate = -8 + Math.random() * 16;

      button.style.left = left + "%";
      button.style.top = top + "%";
      button.style.transform = `rotate(${rotate}deg)`;

      button.addEventListener("click", () => {
        if (url !== "#") {
          location.href = url;
        }
      });

      container.appendChild(button);
    }

  } catch (error) {
    console.error(error);
    container.textContent = "読み込みエラー: " + error.message;
  }
}

loadDiscography();
</script>
