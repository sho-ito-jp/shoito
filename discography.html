    <h1 class="page-title">ディスコグラフィー</h1>
    <p class="lead">探してください。どこに何があるかは、あまり気にしないでください。</p>
<div class="disco-cloud" id="discography-list">
  <!-- CMSから自動生成 -->
</div>

<script>
async function loadDiscography() {
  const container = document.getElementById("discography-list");
  const overlay = document.querySelector(".cd-overlay");

  const discSound = () => {
    const s = new Audio("disc.wav");
    s.volume = 0.55;
    s.play().catch(() => {});
  };

  try {
    const response = await fetch(
      "https://api.github.com/repos/sho-ito-jp/shoito/contents/content/discography"
    );

    if (!response.ok) {
      throw new Error("GitHub API error");
    }

    const files = await response.json();

    for (const file of files) {
      if (!file.name.endsWith(".md")) continue;

      const mdResponse = await fetch(file.download_url);
      const text = await mdResponse.text();

      const frontMatterMatch = text.match(
        /^---\s*([\s\S]*?)\s*---/m
      );

      if (!frontMatterMatch) continue;

      const frontMatter = frontMatterMatch[1];

      const getValue = (name) => {
        const match = frontMatter.match(
          new RegExp("^" + name + ":\\s*(.+)$", "m")
        );
        return match ? match[1].trim() : "";
      };

      const title = getValue("title");
      const url = getValue("url");
      const cover = getValue("cover");
      const left = getValue("left");
      const top = getValue("top");
      const rotate = getValue("rotate");

      if (!title) continue;

      const button = document.createElement("button");

      button.className = "track";
      button.setAttribute("data-track", "");
      button.dataset.title = title;
      button.dataset.url = url;
      button.dataset.cover = cover;

      button.textContent = title;

      button.style.left = (left || 10) + "%";
      button.style.top = (top || 10) + "%";
      button.style.transform = `rotate(${rotate || 0}deg)`;

      // クリック時のCD演出
      button.addEventListener("click", () => {
        
        discSound();

if (overlay) {
  overlay.classList.add("show");

  overlay.style.opacity = "1";
overlay.style.visibility = "visible";

const cd = overlay.querySelector(".cd");

if (cd) {
  cd.style.transform = "translateY(0) scale(1)";
  cd.style.opacity = "1";
}

  const cd = overlay.querySelector(".cd");

  if (cd) {
    cd.style.setProperty("--disc", cover || "#ddd");
  }

  const titleElement = overlay.querySelector("[data-cd-title]");

  if (titleElement) {
    titleElement.textContent = title;
  }
}

        setTimeout(() => {
          if (url && url !== "#") {
            location.href = url;
          }
        }, 1300);
      });

      container.appendChild(button);
    }

  } catch (error) {
    console.error(
      "ディスコグラフィーの読み込みに失敗しました:",
      error
    );
  }
}

loadDiscography();
</script>
